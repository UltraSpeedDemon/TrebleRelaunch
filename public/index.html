<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />

    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />

    <title>%WEB_TITLE%</title>

    <!-- Treble PWA / Home Screen -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/treble-icon-192.png"
    />

    <meta
      name="theme-color"
      content="#101010"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Treble"
    />

    <meta
      name="application-name"
      content="Treble"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />

    <!-- React Native Web reset -->
    <style id="expo-reset">
  html,
  body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;

    background-color: #222222;
  }

  html {
    height: 100%;
  }

  body {
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    overflow: hidden;
  }

  #root {
    display: flex;
    flex: 1;

    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;

    padding-top: env(safe-area-inset-top);
    padding-bottom: 0;

    box-sizing: border-box;
    background-color: #222222;
  }
</style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
