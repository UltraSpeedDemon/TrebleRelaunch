name: Create .env file based on Github Secrets
uses: ozaytsev86/create-env-file-action@v2.0.0


on:
  push:
    branches:
      - master
jobs: 
  create_env_file_job:
    runs-on: ubuntu-latest
    steps:
      - name: Create .env file
        uses: ozaytsev86/create-env-file@v2.0.0
        with:
          ENV_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          ENV_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          ENV_SPOTIFY_SCOPE: ${{ secrets.SPOTIFY_SCOPE }}
